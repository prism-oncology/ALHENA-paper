    - 5
  gaussnoise:
    p: 0.15
  randombrightnesscontrast:
    p: 0.4
    brightness_limit: 0.2
    contrast_limit: 0.2
  superpixels:
    p: 0.1
  zoomblur:
    p: 0.1
