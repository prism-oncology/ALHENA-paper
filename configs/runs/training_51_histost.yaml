    center_teacher_target: true
  pretrained_histost: null
training:
  batch_size: 128
  num_workers: 23
  epochs: 20
  optimizer_hyperparameters:
    lr: 1.0e-05
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.01
    eps: 0.0001
