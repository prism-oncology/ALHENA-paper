  project: HistoST
  notes: 'training_51'
  log_comment: training_51
  tags:
  - HistoST
  - training_51
  - control_lesion_battery
  training_id_histost: training_51
  level: info
  group: control_lesion_battery
seed: 42
device_type: cuda
data:
  dataset_id: ds_ct1_20x_224_o112
